<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E31C23">
  <meta name="description" content="Staff order management dashboard.">
  <title>Staff Order Dashboard · Jollibee</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
  <main id="admin-main" tabindex="-1">
    <section class="admin-shell">
      <div class="admin-brand">
        <div>
          <span class="eyebrow">Staff</span>
          <h1>Order dashboard</h1>
          <p class="lead">Sign in with a Supabase Auth staff account to view and update orders.</p>
        </div>
        <a class="admin-back" href="index.html#/">Back to site</a>
      </div>

      <div id="login-panel" class="admin-panel">
        <h2>Staff sign in</h2>
        <form id="login-form" class="admin-form">
          <label>Email<input id="staff-email" type="email" autocomplete="username" required></label>
          <label>Password<input id="staff-password" type="password" autocomplete="current-password" required></label>
          <button class="cta" type="submit" id="login-btn">Sign in</button>
          <p id="login-msg" class="admin-msg" role="status"></p>
        </form>
      </div>

      <div id="dashboard" hidden>
        <div class="admin-toolbar">
          <div>
            <span class="admin-kicker">Signed in</span>
            <strong id="staff-email-label"></strong>
          </div>
          <div class="toolbar-actions">
            <label class="view-select">View
              <select id="view-select">
                <option value="active">Active orders</option>
                <option value="closed">Closed — last 2 days</option>
              </select>
            </label>
            <button class="add ghost" type="button" id="refresh-btn">Refresh</button>
            <button class="add ghost" type="button" id="signout-btn">Sign out</button>
          </div>
        </div>

        <div id="dash-msg" class="admin-msg" role="status"></div>
        <div id="orders" class="orders-grid" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
